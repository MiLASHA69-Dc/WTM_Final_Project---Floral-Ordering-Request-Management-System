{% extends 'base.html' %}
{% block title %}Register | BloomBuds{% endblock %}
{% block content %}
    <section class="auth-card">
        <h1>Create your BloomBuds account</h1>
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {{ form.as_p }}
            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
    </section>
{% endblock %}
