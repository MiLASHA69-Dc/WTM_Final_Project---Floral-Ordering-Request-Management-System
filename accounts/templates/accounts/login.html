{% extends 'base.html' %}
{% block title %}Log in | BloomBuds{% endblock %}
{% block content %}
    <section class="auth-card">
        <h1>Log in to BloomBuds</h1>
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {{ form.as_p }}
            <button type="submit">Log in</button>
        </form>
        <p>New here? <a href="{% url 'register' %}">Create an account</a></p>
    </section>
{% endblock %}
